<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pedidos del local</title>
<style>
:root{--bg:#f6f3ee;--fg:#1d1b18;--card:#fff;--mut:#6f6a62;--line:#ddd7cc;--acc:#2f7d3a;--accfg:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171613;--fg:#f1ede5;--card:#24221e;--mut:#a29c91;--line:#38342d;--acc:#4caf5a;--accfg:#10200f}}
:root[data-theme="dark"]{--bg:#171613;--fg:#f1ede5;--card:#24221e;--mut:#a29c91;--line:#38342d;--acc:#4caf5a;--accfg:#10200f}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.3 "Trebuchet MS","Segoe UI",system-ui,sans-serif;padding-bottom:84px}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:10px 12px;display:flex;gap:8px;align-items:center;z-index:5;border-bottom:1px solid var(--line)}
h1{font-size:16px;margin:0;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}header{gap:6px;flex-wrap:wrap}header>button{padding:8px 12px;font-size:15px}.nav{display:flex;gap:6px;flex:1 1 100%}.nav button.cs{background:#c62828;border-color:#c62828;color:#fff;font-weight:700;font-size:12px;white-space:nowrap;padding:9px 0}.nav button{flex:1;min-width:0;padding:9px 2px;font-size:14px}.r2{display:flex;justify-content:space-between;gap:10px;padding:11px 0;font-size:17px}.r2.bd{font-weight:700}.sec{color:var(--acc);font-size:15px;margin:14px 0 2px;padding-top:12px;border-top:1px solid var(--line)}.ob{width:100%;padding:14px;border:2px solid var(--acc);background:transparent;color:var(--acc);font-weight:700;letter-spacing:.5px;margin-bottom:10px}
button{font:inherit;color:inherit;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 12px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
button.p{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:700}
button.on{background:var(--fg);color:var(--bg)}
input{font:inherit;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg)}
#q{margin:10px 12px 6px;width:calc(100% - 24px)}#cats{display:flex;gap:6px;overflow-x:auto;padding:4px 12px 10px}#cats button{white-space:nowrap}#sync{font-size:12px;color:var(--mut);padding:0 12px 6px}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:0 12px}
.t{min-height:92px;border:0;border-radius:12px;color:#fff;font-weight:700;font-size:14px;text-align:left;padding:10px;display:flex;flex-direction:column;justify-content:space-between;position:relative}
.t span:not(.n),.t small{text-shadow:-1.5px -1.5px 0 #3b0a5c,1.5px -1.5px 0 #3b0a5c,-1.5px 1.5px 0 #3b0a5c,1.5px 1.5px 0 #3b0a5c,0 2px 0 #3b0a5c,0 -2px 0 #3b0a5c,2px 0 0 #3b0a5c,-2px 0 0 #3b0a5c}.t small{font-weight:600}
.t .n{position:absolute;top:6px;right:6px;background:#fff;color:#000;border-radius:99px;min-width:24px;padding:1px 7px;font-size:13px;text-align:center}
#bar{position:fixed;left:0;right:0;bottom:0;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
#bar button{width:100%;padding:14px;font-size:17px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;z-index:9}
.ov.s{display:flex}
.sh{background:var(--bg);width:100%;max-height:88%;overflow:auto;border-radius:16px 16px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px))}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.row b{flex:1}.q{display:flex;align-items:center;gap:8px}.q button{padding:4px 12px}
.tot{display:flex;justify-content:space-between;font-size:20px;font-weight:700;padding:12px 0}
.g{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mut{color:var(--mut);font-size:14px}.rm{min-height:62px}.t small{margin-top:auto}.pr,.ph{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr) minmax(0,1fr);gap:6px;align-items:center}.pr{padding:6px 0;border-bottom:1px solid var(--line)}.pr b{font-size:15px;line-height:1.2}.pr input{padding:8px 6px;font-size:15px;text-align:right}.ph{margin:14px 0 2px;padding-top:10px;border-top:1px solid var(--line);font-size:14px;color:var(--mut)}.ph span:first-child{color:var(--acc);font-size:15px}.ph span:not(:first-child){text-align:right}.pm{display:inline-block;padding:1px 9px;border-radius:99px;font-size:13px;font-weight:700;line-height:1.5}.pm.ef{background:#1e6fb8;color:#fff}.pm.tr{background:#f2c200;color:#1d1b18}.bx{background:var(--card);border:2px solid var(--line);border-radius:10px;padding:7px 4px;min-width:0;text-align:center;line-height:1.2}.bx span{display:block;font-size:11px;color:var(--mut)}.bx b{font-size:14px;white-space:nowrap}.bx.rf{border-color:currentColor}.rf,.rf .mut{color:#d32f2f}:root[data-theme="dark"] .rf,:root[data-theme="dark"] .rf .mut{color:#ff7a7a}.rf .am{text-decoration:line-through}.sw{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}.sw .row{background:var(--bg);border-bottom:0;position:relative;touch-action:pan-y;transition:transform .18s;user-select:none}.del{position:absolute;right:0;top:0;bottom:0;width:72px;background:#c62828;color:#fff;border:0;border-radius:0;font-size:22px;padding:0}button.on .mut{color:inherit}#sv,#bT,#bV{background:#d96a00;border-color:#d96a00;color:#fff;font-weight:700}#bS{background:#7a3fd1;border-color:#7a3fd1;color:#fff;font-weight:700}
</style></head><body>

function turnoView(){
 var sh=ensureShift();
 if(sh.closed){var L=sh.last,h2='<h2 style="margin:0 0 12px">Turno</h2><p class="rf" style="font-weight:700;font-size:18px;margin:0 0 12px">El turno está cerrado</p><button class="ob" id="ta2">ABRIR TURNO</button>';
  if(L){h2+='<div class="sec">Último cierre</div>'+rw('Cierre de caja #',L.n)+rw('Cerrado',fecha(L.closedAt)+' '+hora(L.closedAt))+rw('Efectivo contado',money(L.counted))+rw('Diferencia',(L.diff>0?'+':L.diff<0?'−':'')+money(Math.abs(L.diff)))+rw('Ventas netas',money(L.net),1)}
  h2+='<button id="cl" style="width:100%;margin-top:12px">Volver</button>';
  open(h2);$("cl").onclick=close;$("ta2").onclick=function(){abrirTurno(turnoView,turnoView)};return}
 var c=shiftCalc(sh);
 open('<h2 style="margin:0 0 12px">Turno</h2><button class="ob" id="tg">GESTIÓN DE TESORERÍA</button><button class="ob" id="tc">CERRAR EL TURNO</button><div class="r2" style="padding:6px 0">Número de cierre de caja: '+sh.n+'</div><div class="r2" style="padding:6px 0;font-size:15px;white-space:nowrap"><span>Abierto: '+esc(sh.by)+'</span><span>'+fecha(sh.openedAt)+' '+hora(sh.openedAt)+'</span></div>'
  +'<div class="sec">Cajón de efectivo</div>'+rw('Base de caja (inicio)',money(sh.fund))+rw('Cobros en efectivo',money(c.ci))+rw('Reembolsos en efectivo',money(c.cr))+rw('Depositado',money(c.dep))+rw('Pagos/Salidas',money(c.out))+rw('Efectivo teórico en caja',money(c.theo),1)
  +'<div class="sec">Resumen de ventas</div>'+rw('Ventas brutas',money(c.g),1)+rw('Reembolsos',money(c.rf))+rw('Descuentos',money(0))+'<div style="border-top:1px solid var(--line)"></div>'+rw('Ventas netas',money(c.net),1)+rw('Efectivo',money(c.ci-c.cr))+rw('Transferencia',money(c.ti-c.tr))
  +'<button id="cl" style="width:100%;margin-top:12px">Volver</button>');
 $("cl").onclick=close;$("tg").onclick=tesoreria;$("tc").onclick=cerrarTurno}
function tesoreria(){
 var sh=ensureShift(),tipo="in";
 var h='<h2 style="margin:0 0 12px">Gestión de tesorería</h2><div class="g"><button id="ti" class="on">Depositar efectivo</button><button id="to">Pago o salida</button></div><input id="ta" type="text" inputmode="numeric" data-m="1" autocomplete="off" placeholder="Monto" style="margin-top:10px"><input id="tn" maxlength="60" placeholder="Nota (opcional)" style="margin-top:8px"><p id="te" class="rf" style="margin:6px 0 0"></p><button class="p" id="tsv" style="width:100%;margin-top:8px;padding:14px">Guardar</button>';
 if(sh.moves.length){h+='<div class="sec">Movimientos de este turno</div>';
  sh.moves.slice().reverse().forEach(function(m,k){var i=sh.moves.length-1-k;
   h+='<div class="row"><b>'+(m.type==="in"?'Depósito':'Pago / Salida')+' · '+hora(m.at)+(m.note?'<br><span class="mut">'+esc(m.note)+'</span>':'')+'</b><span>'+money(m.amount)+'</span><button data-q="'+i+'" style="padding:4px 10px;font-size:14px">Quitar</button></div>'})}
 h+='<button id="cl" style="width:100%;margin-top:12px">Volver</button>';
 open(h);
 function sel(t){tipo=t;$("ti").className=t==="in"?"on":"";$("to").className=t==="out"?"on":""}
 $("ti").onclick=function(){sel("in")};$("to").onclick=function(){sel("out")};
 $("cl").onclick=turnoView;
 $("tsv").onclick=function(){var v=num($("ta").value);if(!(v>0)){$("te").textContent="Escribe un monto mayor a cero.";return}
  sh.moves.push({type:tipo,amount:v,note:$("tn").value.trim(),at:Date.now()});saveShift();tesoreria()};
 $("sh").querySelectorAll("[data-q]").forEach(function(b){b.onclick=function(){sh.moves.splice(+b.dataset.q,1);saveShift();tesoreria()}})}
function cerrarTurno(){
 var sh=ensureShift(),c=shiftCalc(sh);
 open('<h2 style="margin:0 0 8px">Cerrar el turno</h2>'+rw('Efectivo teórico en caja',money(c.theo),1)+'<input id="ct" type="text" inputmode="numeric" data-m="1" autocomplete="off" placeholder="Efectivo contado" value="'+fm(Math.max(0,c.theo))+'"><div class="r2" id="cd"><span>Diferencia</span><span>$0</span></div><p class="mut">Al cerrar, el turno queda cerrado hasta que lo abras otra vez con una nueva base de caja.</p><div class="g"><button id="cn">Cancelar</button><button id="cs" style="background:#c62828;color:#fff;border-color:#c62828">Cerrar turno</button></div>');
 function dif(){var v=num($("ct").value);if(!(v>=0)){$("cd").lastChild.textContent="—";return}var d=v-c.theo;$("cd").lastChild.textContent=(d>0?"+":d<0?"−":"")+money(Math.abs(d));$("cd").lastChild.style.color=d===0?"":"#d32f2f"}
 $("ct").oninput=dif;$("cn").onclick=turnoView;
 $("cs").onclick=function(){var v=num($("ct").value);if(!(v>=0))return;
  var now=Date.now(),rec={n:sh.n,by:sh.by,openedAt:sh.openedAt,closedAt:now,fund:sh.fund,cashIn:c.ci,cashRef:c.cr,dep:c.dep,out:c.out,theo:c.theo,counted:v,diff:v-c.theo,gross:c.g,refunds:c.rf,net:c.net,cashNet:c.ci-c.cr,trNet:c.ti-c.tr};
  if(db)db.doc("shifts/"+sh.n).set(rec).catch(function(){});
  if(mcp)mcp.callTool("Google Sheets","append_values",{spreadsheetId:SHEET,range:"Turnos!A:P",values:[[rec.n,fmt(rec.openedAt),fmt(rec.closedAt),rec.fund,rec.cashIn,rec.cashRef,rec.dep,rec.out,rec.theo,rec.counted,rec.diff,rec.gross,rec.refunds,rec.net,rec.cashNet,rec.trNet]]}).catch(function(){});
  S.shift={n:sh.n+1,closed:true,closedAt:now,by:sh.by,fund:v,moves:[],last:rec};saveShift();turnoView()}}
$("bTu").onclick=function(){if(S.shift&&S.shift.closed)abrirTurno(turnoView,close);else turnoView()};
function saveStock(){local();draw();if(db)db.doc("config/stock").set({stock:S.stock}).catch(function(){});syncPrices()}
function applyStock(t,sign){var ch=false;S.stock=S.stock||{};t.lines.forEach(function(l){if(l.item&&S.stock[l.item]!==undefined){S.stock[l.item]=Math.max(0,S.stock[l.item]-sign*l.qty);ch=true}});if(ch)saveStock()}
function preciosView(){
 S.menu.dprices=S.menu.dprices||{};S.stock=S.stock||{};
 function row(k,name,inv){var pv=k==="d"?S.menu.dprices[name]:S.menu.prices[name];
  return '<div class="pr"><b>'+esc(name)+'</b><input type="text" inputmode="numeric" data-m="1" data-k="'+k+'" data-n="'+esc(name)+'" data-f="p" aria-label="Precio de '+esc(name)+'" value="'+fm(pv)+'">'+(inv?'<input type="text" inputmode="numeric" data-m="1" data-k="'+k+'" data-n="'+esc(name)+'" data-f="s" aria-label="Inventario de '+esc(name)+'" value="'+fm(S.stock[k.toUpperCase()+":"+name])+'">':'<span></span>')+'</div>'}
 function head(t,inv){return '<div class="ph"><span>'+t+'</span><span>Precio</span><span>'+(inv?'Inventario':'')+'</span></div>'}
 var h='<h2 style="margin:0 0 4px">Precios e inventario</h2><p class="mut" style="margin:0">Los cambios se guardan al salir de cada campo. Deja el inventario vacío si no quieres llevar la cuenta de esa bebida.</p>'+head('Bebidas con sabor',true);
 DRINKS.forEach(function(d){h+=row("d",d,true)});
 h+=head('Bebidas solas',true);SOLOS.forEach(function(d){h+=row("s",d,true)});
 h+=head('Envenenadas',false);ENV.forEach(function(d){h+=row("p",d,false)});
 h+='<button class="p" id="cl" style="width:100%;margin-top:14px;padding:14px">Listo</button>';
 open(h);$("cl").onclick=close;
 $("sh").onchange=function(e){var t=e.target;if(!t.dataset||!t.dataset.f)return;var v=num(t.value),k=t.dataset.k,n=t.dataset.n;
  if(t.dataset.f==="p"){var map=k==="d"?S.menu.dprices:S.menu.prices;if(isNaN(v))delete map[n];else map[n]=v;saveMenu()}
  else{var key=k.toUpperCase()+":"+n;if(isNaN(v))delete S.stock[key];else S.stock[key]=v;saveStock()}}}
$("bP").onclick=preciosView;
function doRefund(t){t.refunded=true;t.refundAt=Date.now();saveTicket(t);applyStock(t,-1);S.pend=S.pend||[];S.pend.push(refundRows(t));local();draw();flush()}
$("bS").onclick=function(){
 var d=new Date().toDateString(),paid=S.tickets.filter(function(x){return x.status==="paid"&&new Date(x.at).toDateString()===d}).sort(function(a,b){return a.at-b.at});
 var tot=0,ef=0,tr=0,n=0,rn=0,rt=0;
 paid.forEach(function(t){var v=t.total||total(t);if(t.refunded){rn++;rt+=v;return}n++;tot+=v;if(t.pay==="Efectivo")ef+=v;else if(t.pay==="Transferencia")tr+=v});
 var h='<h2 style="margin:0 0 10px;font-size:20px">Ventas del día</h2><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:8px"><div class="bx" style="border-color:#1e6fb8"><span>Efectivo</span><b>'+money(ef)+'</b></div><div class="bx" style="border-color:#f2c200"><span>Transferencia</span><b>'+money(tr)+'</b></div><div class="bx rf"><span>Reembolsos ('+rn+')</span><b>'+money(rt)+'</b></div></div>';
 if(!paid.length)h+='<p class="mut">Todavía no hay ventas hoy.</p>';
 for(var i=paid.length-1;i>=0;i--){var t=paid[i],v=t.total||total(t);
  h+='<div class="row'+(t.refunded?' rf':'')+'" data-i="'+i+'"><b>#'+(i+1)+' · '+hora(t.at)+'<br><span class="mut">'+fecha(t.at)+' · '+pmHtml(t.pay)+(t.name?' · '+esc(t.name):'')+'</span><br><span class="mut" style="font-weight:400">'+t.lines.map(function(l){return l.qty+' × '+esc(l.name)}).join(', ')+'</span></b><div style="text-align:right"><span class="am">'+money(v)+'</span><br>'+(t.refunded?'<span style="font-weight:700;font-size:14px">Reembolsada<br>'+hora(t.refundAt)+'</span>':'<button data-rf="'+i+'" style="margin-top:6px;padding:4px 10px;font-size:14px">Reembolsar</button>')+'</div></div>'}
 h+='<button id="cl" style="width:100%;margin-top:10px">Cerrar</button>';
 open(h);$("cl").onclick=close;
 $("sh").querySelectorAll("[data-rf]").forEach(function(b){b.onclick=function(){
  var t=paid[+b.dataset.rf],row=b.closest(".row");
  row.innerHTML='<b>¿Reembolsar la venta #'+(+b.dataset.rf+1)+'?<br><span class="mut">'+money(t.total||total(t))+' · '+pmHtml(t.pay)+'</span></b><button data-no="1">Cancelar</button><button data-si="1" style="background:#c62828;color:#fff;border-color:#c62828">Reembolsar</button>';
  row.querySelector("[data-no]").onclick=function(){$("bS").onclick()};
  row.querySelector("[data-si]").onclick=function(){doRefund(t);$("bS").onclick()}}})};
$("bT").onclick=function(){
 var d=new Date().toDateString(),day=S.tickets.filter(function(s){return s.status==="paid"&&!s.refunded&&new Date(s.at).toDateString()===d}),sum=day.reduce(function(a,s){return a+(s.total||0)},0);
 var op=S.tickets.filter(function(x){return x.status==="open"}),h='<h2>Tickets abiertos</h2>';
 if(!op.length)h+='<p class="mut">No hay tickets abiertos. Guarda uno desde el ticket actual.</p>';
 op.forEach(function(t,i){h+='<div class="sw"><button class="del" data-x="'+i+'" aria-label="Eliminar ticket">🗑️</button><div class="row sr"><b>'+esc(t.name||"Sin nombre")+'<br><span class="mut">'+t.lines.length+' artículos</span></b><span>'+money(total(t))+'</span><button data-r="'+i+'">Abrir</button></div></div>'});
 h+='<div class="tot"><span>Ventas de hoy ('+day.length+')</span><span>'+money(sum)+'</span></div><button id="cl" style="width:100%">Cerrar</button>';
 open(h);$("cl").onclick=close;
 $("sh").querySelectorAll(".sw").forEach(swipeRow);
 $("sh").querySelectorAll("[data-x]").forEach(function(b){b.onclick=function(){
  var t=op[+b.dataset.x],sw=b.parentNode;
  sw.innerHTML='<div class="row"><b>¿Eliminar "'+esc(t.name||"Sin nombre")+'"?<br><span class="mut">'+money(total(t))+'</span></b><button data-c="1">Cancelar</button><button data-y="1" style="background:#c62828;color:#fff;border-color:#c62828">Eliminar</button></div>';
  sw.querySelector("[data-c]").onclick=function(){$("bT").onclick()};
  sw.querySelector("[data-y]").onclick=function(){delTicket(t);$("bT").onclick()}}});
 $("sh").querySelectorAll("[data-r]").forEach(function(b){b.onclick=function(){
  if(S.cur&&S.cur.lines.length){S.cur.status="open";S.cur.total=total(S.cur);saveTicket(S.cur)}
  S.cur=JSON.parse(JSON.stringify(op[+b.dataset.r]));local();draw();cart()}})};
$("ov").onclick=function(e){if(e.target===this)close()};
function eff(){return S.theme||(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light")}
function applyTheme(){var e=eff();document.documentElement.setAttribute("data-theme",e);$("bM").textContent=e==="dark"?"☀️":"🌙";$("bM").setAttribute("aria-label",e==="dark"?"Cambiar a modo claro":"Cambiar a modo oscuro")}
$("bM").onclick=function(){S.theme=eff()==="dark"?"light":"dark";local();applyTheme()};
applyTheme();
draw();
if(window.claude&&claude.use){
 claude.use("db").then(function(d){if(!d)return;db=d;
  d.collection("tickets").onSnapshot(function(sn){var cs=S.cur?S.cur.id:null;S.tickets=sn.docs.map(function(x){var o=JSON.parse(JSON.stringify(x.data()));o.id=x.id;return o});local();draw()});
  d.doc("config/shift").onSnapshot(function(sn){if(sn.exists){var m=JSON.parse(JSON.stringify(sn.data()));m.moves=m.moves||[];S.shift=m;local();draw()}});
  d.doc("config/stock").onSnapshot(function(sn){if(sn.exists){var m=JSON.parse(JSON.stringify(sn.data()));S.stock=m.stock||{};local();draw()}});
  d.doc("config/menu").onSnapshot(function(sn){if(sn.exists){var m=JSON.parse(JSON.stringify(sn.data()));m.prices=m.prices||{};m.photos=m.photos||{};m.dprices=m.dprices||{};S.menu=m;local()}draw()});
  draw()}).catch(function(){});
 claude.use("assets").then(function(a){assets=a}).catch(function(){});
 claude.use("mcp").then(function(m){if(!m)return;mcp=m;msg="Drive conectado.";draw();flush()}).catch(function(){});
}
</script></body></html>
